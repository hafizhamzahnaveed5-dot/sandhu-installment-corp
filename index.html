<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandhu Installment Corporation</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Installment plan tracking, payments, and daily ledger for Sandhu Installment Corporation.">
  <meta name="theme-color" content="#0E7490">
  <meta property="og:title" content="Sandhu Installment Corporation">
  <meta property="og:description" content="Installment plan tracking, payments, and daily ledger.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">
  
  <!-- Favicon — layered "S" mark matching the sidebar logo -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7490'/%3E%3Cpath d='M32 12L14 21l18 9 18-9-18-9zM14 39l18 9 18-9M14 30l18 9 18-9' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7490'/%3E%3Cpath d='M32 12L14 21l18 9 18-9-18-9zM14 39l18 9 18-9M14 30l18 9 18-9' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>

  <!-- Global error trap — shows crash details on-screen if app.js fails to boot -->
  <script>
    function bootErrorScreen(title, detailHtml) {
      document.body.innerHTML = '<div style="font-family:\'Segoe UI\',system-ui,sans-serif;padding:48px 32px;background:#F5F7FA;min-height:100vh;color:#0F172A">'
        + '<div style="max-width:720px;margin:0 auto;background:#fff;border:1px solid rgba(15,23,42,0.08);border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,0.08)">'
        + '<h2 style="margin:0 0 8px;color:#DC2626;font-size:20px">' + title + '</h2>'
        + '<p style="margin:0 0 16px;color:#475569;font-size:14px">Please refresh the page. If this keeps happening, share the details below.</p>'
        + detailHtml
        + '</div></div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      bootErrorScreen('Application failed to start',
        '<p style="margin:0 0 6px;font-size:13px"><strong>Message:</strong> ' + msg + '</p>'
        + '<p style="margin:0 0 6px;font-size:13px"><strong>File:</strong> ' + src + ' (' + line + ':' + col + ')</p>'
        + '<pre style="white-space:pre-wrap;background:#F5F7FA;border-radius:8px;padding:12px;font-size:12px;color:#475569;margin-top:12px">' + (err ? err.stack : '') + '</pre>');
    };
    window.addEventListener('unhandledrejection', function(e) {
      bootErrorScreen('Something went wrong',
        '<pre style="white-space:pre-wrap;background:#F5F7FA;border-radius:8px;padding:12px;font-size:12px;color:#475569">' + (e.reason ? (e.reason.stack || e.reason) : e) + '</pre>');
    });
  </script>

  <!-- AUTH LAYOUT (Login, Forgot Password) -->
  <div id="auth-layout" style="display: none;"></div>

  <!-- APPLICATION SHELL (Dashboard & Operations) -->
  <div id="app-shell" style="display: none;">
    <!-- Sidebar navigation -->
    <aside id="sidebar"></aside>

    <!-- Mobile Navigation Overlay backdrop -->
    <div id="sidebar-overlay"></div>

    <!-- Main Workspace wrapper -->
    <div id="main-wrapper">
      <!-- Navbar / Top Header -->
      <header id="topbar"></header>

      <!-- Dynamic Page Container -->
      <main id="page-content"></main>
    </div>
  </div>

  <!-- Main Routing Logic -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
